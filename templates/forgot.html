{% extends 'base.html' %}
{% block title %}Reset Request - Global Payments HRIS{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card card-custom p-4">
            <h4 class="fw-bold text-gp mb-2">Forgot Password</h4>
            <p class="text-muted small mb-4">Enter your registered email address to receive a 6-digit OTP code.</p>
            <form action="/forgot-password" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold">Email Address</label>
                    <input type="email" name="email" class="form-control" required placeholder="name@globalpayments.com">
                </div>
                <button type="submit" class="btn btn-gp w-100 fw-bold">Send Reset OTP</button>
            </form>
            <a href="/login" class="d-block text-center text-muted small mt-3">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}

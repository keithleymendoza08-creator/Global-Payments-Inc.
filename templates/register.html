{% extends 'base.html' %}
{% block title %}Register - Global Payments HRIS{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card card-custom p-4">
            <h4 class="fw-bold text-gp mb-3">Employee Registration</h4>
            <form action="/register" method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Employee ID</label>
                        <input type="text" name="employee_id" class="form-control" required placeholder="GP-10023">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Full Name</label>
                        <input type="text" name="fullname" class="form-control" required placeholder="John Doe">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Email Address</label>
                        <input type="email" name="email" class="form-control" required placeholder="john.doe@globalpayments.com">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Password (Min. 8 chars)</label>
                        <input type="password" name="password" class="form-control" required placeholder="••••••••">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Department</label>
                        <select name="department" class="form-select" required>
                            <option value="">Select Department</option>
                            <option value="IT & Infrastructure">IT & Infrastructure</option>
                            <option value="Finance & Accounting">Finance & Accounting</option>
                            <option value="Human Resources">Human Resources</option>
                            <option value="Operations">Operations</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Job Title</label>
                        <input type="text" name="job_title" class="form-control" required placeholder="Software Engineer">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Daily Rate (PHP)</label>
                        <input type="number" step="0.01" name="daily_rate" class="form-control" placeholder="1200.00" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Personal Number</label>
                        <input type="text" name="personal_number" class="form-control" placeholder="09123456789" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Hire Date</label>
                        <input type="date" name="hire_date" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Country</label>
                        <input type="text" name="country" class="form-control" value="Philippines" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-bold">Personal Address</label>
                        <input type="text" name="personal_address" class="form-control" placeholder="House No., Street, Barangay, City" required>
                    </div>

                    <!-- Shift Start & Shift End -->
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Shift Start</label>
                        <input type="time" name="shift_start" class="form-control" value="09:00" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Shift End</label>
                        <input type="time" name="shift_end" class="form-control" value="18:00" required>
                    </div>

                    <!-- REST DAYS CHECKBOXES -->
                    <div class="col-12">
                        <label class="form-label fw-bold">Rest Days</label>
                        <div class="d-flex flex-wrap gap-3 p-2 border rounded bg-light">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="rest_days" value="Monday" id="rest_mon">
                                <label class="form-check-label" for="rest_mon">Monday</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="rest_days" value="Tuesday" id="rest_tue">
                                <label class="form-check-label" for="rest_tue">Tuesday</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="rest_days" value="Wednesday" id="rest_wed">
                                <label class="form-check-label" for="rest_wed">Wednesday</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="rest_days" value="Thursday" id="rest_thu">
                                <label class="form-check-label" for="rest_thu">Thursday</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="rest_days" value="Friday" id="rest_fri">
                                <label class="form-check-label" for="rest_fri">Friday</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="rest_days" value="Saturday" id="rest_sat" checked>
                                <label class="form-check-label" for="rest_sat">Saturday</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="rest_days" value="Sunday" id="rest_sun" checked>
                                <label class="form-check-label" for="rest_sun">Sunday</label>
                            </div>
                        </div>
                    </div>

                    <!-- Work Location -->
                    <div class="col-12">
                        <label class="form-label fw-bold">Work Location</label>
                        <input type="text" name="work_location" class="form-control" placeholder="e.g. Cubao Quezon City" value="Cubao Quezon City" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-gp-accent w-100 fw-bold py-2 mt-4">Register Employee</button>
            </form>
            <p class="text-center small mt-3 mb-0">Already registered? <a href="/login" class="fw-bold text-gp">Login here</a></p>
        </div>
    </div>
</div>
{% endblock %}
